<html lang="ar">

</head>

<body>

    <main class="hero"> 

      <div class="clock-widget" dir="rtl">

  <div class="clock-divider"></div>
  <div class="clock-date" id="clockDate">--</div>
  <div class="clock-hijri" id="clockHijri"></div>
</div>


        <header class="navbar">

        <div class="logo"><img src="logo.png" alt="جمار" height="110"></div>

<div class="hero-cards">
  <a href="sales.html" class="hero-card">

  </a>
  <a href="inventory.html" class="hero-card">

  <a href="finance.html" class="hero-card">

  <a href="purchases.html" class="hero-card">

        <section class="hero-content">
            <p class="eyebrow">تمور سعودية أصيلة</p>

            <h1>من قلب الأرض<br>إلى مائدتك</h1>

                نقدم لكم أجود أنواع التمور السعودية

            <a href="#" class="main-btn">تقارير جمار ←</a>
        </section>

    </main>

    <script>
        const TZ = 'Asia/Riyadh';

        function updateClock() {
            const now = new Date();

            document.getElementById('clockTime').textContent =
                new Intl.DateTimeFormat('ar-SA-u-nu-latn', {
                    timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
                }).format(now);

            document.getElementById('clockDate').textContent =
                new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', {
                    timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
                }).format(now);

            document.getElementById('clockHijri').textContent =
                new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', {
                    timeZone: TZ, day: 'numeric', month: 'long', year: 'numeric'
                }).format(now);
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>

</html>
