<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jommar – Invoice &amp; Packing List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f1f4f2;--card:#fff;--tx:#1d2a24;--mu:#6b7a72;--ln:#d9e2dc;--g:#1b4332;--gold:#b8963e;--mint:#f3f7f4;--in:#fff;--ac:#1b4332;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1713;--card:#17221c;--tx:#e6efe9;--mu:#93a39a;--ln:#2a3a31;--in:#101a15;--mint:#1c2a22;--ac:#3f8f6b}}
:root[data-theme=dark]{--bg:#0f1713;--card:#17221c;--tx:#e6efe9;--mu:#93a39a;--ln:#2a3a31;--in:#101a15;--mint:#1c2a22;--ac:#3f8f6b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,Arial,sans-serif;background-color:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--g);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 16px}
header.top b{font-size:15px;flex:1}header.top small{opacity:.7;font-weight:400;display:block;font-size:11px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:6}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:rgba(255,255,255,.14);color:#fff}
button.p{background:var(--gold);color:#fff;font-weight:600}
a.hm{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;transition:background .2s}
a.hm:hover{background:rgba(255,255,255,.28)}
nav.tabs{display:flex;gap:4px;padding:10px 16px 0;max-width:1400px;margin:auto}
nav.tabs button{background:var(--card);color:var(--mu);border:1px solid var(--ln);flex:1;border-radius:8px 8px 0 0;font-weight:600}
nav.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
main{display:grid;grid-template-columns:minmax(380px,460px) 1fr;gap:16px;max-width:1400px;margin:auto;padding:12px 16px 40px;align-items:start}
.form{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px}
.card h3{margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.s2{grid-column:span 2}
label{display:block;font-size:11px;color:var(--mu);font-weight:500}
input,select{width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--in);color:var(--tx);font:inherit;min-height:38px}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
.it{border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--mint)}
.it .sum{grid-column:span 2;display:flex;justify-content:space-between;font-size:12px;color:var(--mu);align-items:center}
.it .sum b{color:var(--tx)}.del{background:transparent;color:#c0392b;padding:2px 6px;border:1px solid #c0392b55}
.add{width:100%;background:var(--g);color:#fff;font-weight:600}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kp div{background:var(--g);color:#fff;border-radius:10px;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.05em}.kp b{display:block;font-size:15px;letter-spacing:0}
.pv{min-width:0;overflow:hidden}
.pap{width:794px;min-height:1123px;background:#fff;color:#111;position:relative;padding:0 28px 150px;font-size:10.5px;box-shadow:0 4px 24px #0002;transform-origin:top left;overflow:hidden}
.pap *{color:inherit}
.pap .hd{height:96px;display:flex;justify-content:flex-end;padding-top:14px}.pap .hd img{height:82px}
.pap .tl{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #bfa053;width:100%;padding-bottom:0}
.k{font-size:7.5px;font-weight:700;letter-spacing:.14em;color:#b8963e;text-transform:uppercase}
.pap h1{margin:2px 0 3px;font-size:25px;color:#1b4332;letter-spacing:-.01em}
.nb{background:#f3f7f4;border:1px solid #d3ddd7;border-radius:6px;padding:7px 12px;font-weight:700;color:#1b4332;margin-bottom:6px;font-size:10.5px;line-height:1.9}
.two{display:grid;grid-template-columns:1fr 1fr;margin-top:14px}
.bx{background:#f3f7f4;border:1px solid #d3ddd7;padding:9px 12px;line-height:1.65;font-size:9.5px}
.bx.r{border-left:3px solid #1b4332;border-radius:0 6px 6px 0}.bx.l{border-radius:6px 0 0 6px;border-right:0}
.bx strong{font-size:12px;color:#1b4332;display:block}
.og{background:#f3f7f4;border:1px solid #d3ddd7;border-radius:6px;padding:6px 12px;margin-top:8px;display:flex;gap:80px;font-size:9.5px}
table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:10px}
th{background:#1b4332;color:#fff!important;font-size:8.5px;padding:8px 4px;text-align:center}th:nth-child(2){text-align:left;padding-left:10px}
td{padding:8px 4px;text-align:center;font-size:9.5px;border-bottom:1px solid #e6ece8}td:nth-child(2){text-align:left;padding-left:10px}
tr:nth-child(even) td{background:#f6f8f6}td.b{font-weight:700;font-size:10.5px}
tfoot td{background:#1b4332!important;color:#fff!important;font-weight:700}
.tot{display:grid;grid-template-columns:1.3fr 1.1fr 1fr 1fr;gap:6px;margin-top:10px}
.tot div{border:1px solid #d3ddd7;background:#f3f7f4;border-radius:6px;padding:7px;text-align:center;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6b7a72}
.tot div.d{background:#1b4332;border-color:#1b4332;color:#fff}.tot b{display:block;font-size:17px;letter-spacing:0;color:inherit;text-transform:none;margin-top:3px}.tot b span{font-size:10px;font-weight:500}
.aw{display:flex;justify-content:space-between;margin-top:12px;gap:16px}.aw>div:first-child{flex:1;font-weight:700;font-size:10.5px}
.aw u{display:block;width:150px;text-decoration:none;border-bottom:1px solid #1b4332;font-size:11px;margin-bottom:5px;color:#1b4332}
.st{width:260px;font-size:10.5px}.st p{display:flex;justify-content:space-between;margin:0;padding:6px 10px}.st p.d{background:#1b4332;color:#fff;font-weight:700;font-size:12px;margin-top:5px}
.pay{display:grid;grid-template-columns:1.55fr 1fr;margin-top:14px}.pay .bx:first-child{border-right:0;border-radius:6px 0 0 6px}.pay .bx:last-child{border-radius:0 6px 6px 0}
.tm{margin-top:12px;border-radius:6px}.tm li{margin:2px 0}.tm ul{margin:3px 0 0;padding-left:16px}
.sg{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;font-weight:700;font-size:9.5px}
.sg .ln{width:250px;border-top:2px solid #222;padding-top:5px;text-align:center;margin-top:50px}.circ{width:72px;height:72px;border:1.5px dashed #9ba8a1;border-radius:50%;margin:0 auto 6px}
.vf{display:flex;gap:10px;align-items:center;margin-top:16px;border:1px dashed #9bb0a4;background:#f3f7f4;border-radius:6px;padding:8px 10px}.vf img{width:62px;height:62px}
.vf code{font:700 14px "Courier New",monospace;color:#1b4332;display:block;margin:3px 0}.vf small{display:block;font-size:7.5px;color:#555}
.ft{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto}
.wm{position:absolute;left:50%;top:41%;width:250px;transform:translate(-50%,-30%);opacity:.5;pointer-events:none}
.dr{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-32deg);font-size:150px;font-weight:800;color:#c0392b18;pointer-events:none;letter-spacing:.05em}
.hint{font-size:11px;color:var(--mu);margin:8px 0 0}
@media(max-width:899px){main{grid-template-columns:1fr}}
@media(min-width:900px){#tf{display:none}}
@media print{@page{size:A4;margin:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}html,body{height:auto;background:#fff}header.top,nav.tabs,.form,.hint,.kp,body::before{display:none!important}main{display:block;padding:0;margin:0}.pv{overflow:visible}.pap{zoom:1!important;box-shadow:none;width:210mm;height:296mm;min-height:0;padding-bottom:0;break-inside:avoid;break-after:avoid}.pap .hd{height:70px;padding-top:6px}.pap .hd img{height:62px}.pap h1{font-size:22px}.two{margin-top:10px}.vf{margin-top:8px;padding:6px 10px}.vf img{width:54px;height:54px}td{padding:3.5px 4px}th{padding:6px 4px}.og{margin-top:6px}table{margin-top:7px}.tot{margin-top:7px}.tot div{padding:5px}.tot b{font-size:15px}.aw{margin-top:8px}.pay{margin-top:8px}.tm{margin-top:8px}.bx{line-height:1.5;padding:7px 12px}.sg{margin-top:8px}.sg .ln{margin-top:6px}.circ{width:46px;height:46px;margin-bottom:2px}.ft{width:100%;height:105px;object-fit:cover;object-position:top}.pap.hid{display:none}}
</style></head><body>

<div class="aw"><div><u>Amount in words:</u>${words(C.tot)}</div><div class="st"><p><span>Subtotal</span><span>${n2(C.tot)} $</span></p><p class="d"><span>Total Amount</span><span>${n2(C.tot)} $</span></p></div></div>`:""}
<div class="pay"><div class="bx"><div class="k">Payment Method</div><strong style="margin-top:6px">☑ ${esc(py.method)}</strong></div><div class="bx"><div class="k">Bank Account Details</div>Bank: ${esc(py.bank)}<br>Account Name: ${esc(py.acn)}<br>A/C: ${esc(py.ac)}<br>IBAN: ${esc(py.iban)}<br>SWIFT: ${esc(py.swift)}</div></div>

<img class="ft" src="${FT}" alt="">`}
function draw(){const C=calc();document.getElementById("ci").innerHTML=doc("ci",C);document.getElementById("pl").innerHTML=doc("pl",C);
 document.getElementById("kp").innerHTML=`<div>Total<b>${n2(C.tot)}</b></div><div>Cartons<b>${n0(C.q)}</b></div><div>Net kg<b>${n0(C.nw)}</b></div><div>Gross kg<b>${n0(C.gw)}</b></div>`;
 S.it.forEach((r,i)=>{const x=document.getElementById("sm"+i),c=C.rows.find(z=>z.n==r[0]&&z.nw==+r[3]);if(x)x.innerHTML=c?`<span>${n0(c.q)} ctn · ${n0(c.m)} masters · ${n0(c.gw)} kg GW</span><b>${n2(c.tot)}</b><button class="del" data-d="${i}">✕</button>`:`<span>Fill name &amp; net weight</span><button class="del" data-d="${i}">✕</button>`});fit()}
function fit(){const w=document.getElementById("pv").clientWidth,z=Math.min(1,w/794);document.querySelectorAll(".pap").forEach(p=>{p.style.zoom=z})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let V="ci";function view(v){if(v=="form"&&innerWidth>=900)v="ci";V=v;const f=v=="form";
 document.getElementById("form").style.display=(innerWidth>=900||f)?"flex":"none";document.getElementById("pv").style.display=(innerWidth>=900||!f)?"block":"none";
 document.getElementById("ci").classList.toggle("hid",v=="pl");document.getElementById("pl").classList.toggle("hid",v!="pl");
 [["tf","form"],["tc","ci"],["tp","pl"]].forEach(([i,k])=>document.getElementById(i).classList.toggle("on",k==v||(k=="ci"&&v=="form")));fit()}
document.addEventListener("input",e=>{const t=e.target,k=t.dataset.k,i=t.dataset.i;if(k)st(k,t.type=="number"?(t.value===""?"":+t.value):t.value);else if(i){const[a,b]=i.split(".").map(Number);S.it[a][b]=(b>=2&&t.value!=="")?+t.value:t.value}else return;save();draw()});
document.addEventListener("change",e=>{if(e.target.dataset.k){st(e.target.dataset.k,e.target.value);save();draw()}});
document.addEventListener("click",e=>{const d=e.target.dataset.d;if(d!==undefined){S.it.splice(+d,1);save();document.getElementById("items").innerHTML=itemsHTML();draw()}});
document.getElementById("tf").onclick=()=>view("form");document.getElementById("tc").onclick=()=>view("ci");document.getElementById("tp").onclick=()=>view("pl");
document.getElementById("pr").onclick=()=>{if(innerWidth<900&&V=="form")view("ci");setTimeout(()=>window.print(),50)};
document.getElementById("rs").onclick=()=>{if(confirm("Reset everything to the default data?")){S=DEF();save();build();draw()}};
document.getElementById("th").onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue("--card").trim()=="#17221c";r.dataset.theme=dk?"light":"dark"};
addEventListener("resize",()=>view(V));addEventListener("beforeprint",()=>document.querySelectorAll(".pap").forEach(p=>p.style.zoom=1));addEventListener("afterprint",fit);
build();draw();view(innerWidth<900?"form":"ci");
</script></body></html>
